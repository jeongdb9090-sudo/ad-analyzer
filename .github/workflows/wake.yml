name: Wake Streamlit App

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Selenium
        run: pip install selenium

      - name: Run wake script
        run: python wake_streamlit.py
        env:
          STREAMLIT_URL: "https://wlqdprkrhtlvek.streamlit.app/"
